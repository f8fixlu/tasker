# JMeter Performance Test Configuration for Tasker Application
#
# This file contains configuration parameters for the Tasker performance test.
# You can modify these values to customize the test without editing the JMX file.

# Server Configuration
SERVER_HOST=localhost
SERVER_PORT=5000
BASE_PATH=/api

# Test Parameters
LOGIN_EMAIL=user@example.com
LOGIN_PASSWORD=password123

# Thread Group Configuration
NUM_THREADS=10
RAMP_UP_TIME=5
LOOP_COUNT=1

# Timeout Configuration (in milliseconds)
CONNECTION_TIMEOUT=10000
RESPONSE_TIMEOUT=30000

# Performance Monitoring
MONITOR_RESPONSE_TIMES=true
MONITOR_THROUGHPUT=true
MONITOR_ERROR_RATE=true

# Reporting
GENERATE_HTML_REPORT=true
REPORT_OUTPUT_DIR=jmeter-report
RESULTS_FILE=performance-results.jtl

# Test Scenarios to Enable
ENABLE_LOGIN_TEST=true
ENABLE_GET_PROFILE_TEST=true
ENABLE_GET_TASKS_TEST=true
ENABLE_CREATE_TASK_TEST=true
ENABLE_GET_CATEGORIES_TEST=true
ENABLE_GET_EVENTS_TEST=true

# Timing Delays (in milliseconds)
MIN_DELAY_BETWEEN_REQUESTS=1000
MAX_DELAY_BETWEEN_REQUESTS=3000