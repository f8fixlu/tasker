<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="icon" href="%PUBLIC_URL%/logo/tasker_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Tasker - A powerful task management application"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo/tasker_logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Preconnect to important origins to save time -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Load fonts with font-display: swap to prevent layout shift -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Tasker - Task Management Application</title>
  </head>
  <body class="bg-background-light dark:bg-background-dark">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <!-- PDFMake for PDF generation (version 0.2.7 for better browser compatibility) -->
    <script>
      // Allow CSP for data: URLs needed for PDF generation
      if (window.trustedTypes && window.trustedTypes.createPolicy) {
        window.trustedTypes.createPolicy('default', {
          createScriptURL: (url) => url
        });
      }
